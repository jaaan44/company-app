; Report attachments (Phase 18/19; mobile photos since Phase 33): the API
; accepts files up to config('attachments.max_size_kb') = 10 MB. PHP's
; defaults (upload_max_filesize 2M, post_max_size 8M) refused most of that
; range before Laravel could validate it. A little headroom over 10 MB so
; the application's own 422 ("may not be greater than …") is what a person
; sees, not a bare 413. Used by the local and the staging image.
upload_max_filesize = 12M
post_max_size = 13M
