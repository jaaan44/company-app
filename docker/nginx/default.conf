# Conventional Laravel vhost. Document root is the app's public/ directory
# only — app/, config/, storage/, etc. are never served directly.
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    # Deny access to dotfiles (.env, .git, ...) and any other file outside
    # the public/ document root that isn't routed through index.php above.
    location ~ /\. {
        deny all;
    }
}
