# Conventional Laravel vhost. Document root is the app's public/ directory
# only — app/, config/, storage/, etc. are never served directly.
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Report attachments are up to 10 MB (config/attachments.php); nginx's
    # 1m default answered 413 before Laravel saw them (found in Phase 33).
    # Headroom so the application's own validation message is what shows.
    client_max_body_size 12m;

    # Phase 37 (DEC-067 H-5): compression for phones on mobile data. HTML
    # is always included; the hashed build files are the bulk of the rest.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;

    # Phase 37 (DEC-067 H-5): browser protections on every response. No
    # Content-Security-Policy yet (Phase 39); HSTS belongs to the host's TLS
    # nginx. A location with its own add_header must repeat these.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=(), usb=()" always;

    # Vite's build files have a content hash in their names, so a browser
    # may keep them for a year; a new build gets new names. HTML is never
    # cached this way.
    location ^~ /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=(), usb=()" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    # Deny access to dotfiles (.env, .git, ...) and any other file outside
    # the public/ document root that isn't routed through index.php above.
    location ~ /\. {
        deny all;
    }
}
