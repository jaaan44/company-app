name: Staging images

# Phase 34A (DEC-063): build both staging images on every change that can
# affect them, so a broken Dockerfile, .dockerignore or asset build fails
# here instead of on the VPS (the Phase 33 `uploads.ini` build failure,
# PR #83, was first seen there). Nothing is pushed or deployed.
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'docker/**'
      - '.dockerignore'
      - 'docker-compose.staging.yml'
      - '.github/workflows/staging-images.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'docker/**'
      - '.dockerignore'
      - 'docker-compose.staging.yml'
      - '.github/workflows/staging-images.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build staging images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build the app (PHP-FPM) image
        run: docker build -f docker/php/Dockerfile.staging -t company-app-api:ci .

      - name: Build the nginx image
        run: docker build -f docker/nginx/Dockerfile.staging -t company-app-nginx:ci .

      - name: Check the app image
        run: |
          docker run --rm company-app-api:ci sh -c '
            set -e
            test -f public/build/manifest.json
            php -r "exit(ini_get(\"upload_max_filesize\") === \"12M\" && ini_get(\"post_max_size\") === \"13M\" ? 0 : 1);"
            test ! -e .env
            test ! -d node_modules
            echo "app image OK"'

      # `nginx -t` is not run: the config's upstream `app` only resolves
      # inside the Compose network.
      - name: Check the nginx image
        run: |
          docker run --rm company-app-nginx:ci sh -c '
            set -e
            test -f /var/www/html/public/build/manifest.json
            ls /var/www/html/public/build/assets/*.css
            test -f /var/www/html/public/manifest.json
            test -f /var/www/html/public/icons/icon-192.png
            grep -q "client_max_body_size 12m" /etc/nginx/conf.d/default.conf
            echo "nginx image OK"'

      # Phase 37 (DEC-067 H-5): the built image serves the hashed build files
      # compressed, cached for a year and with the four security headers.
      # `app` is pointed at localhost only so nginx can start.
      - name: Check compression, caching and security headers
        run: |
          docker run -d --name nginx-check --add-host app:127.0.0.1 company-app-nginx:ci
          sleep 2
          docker exec nginx-check sh -c '
            set -e
            css=$(basename "$(ls /var/www/html/public/build/assets/*.css | head -1)")
            headers=$(wget -S -O /dev/null --header "Accept-Encoding: gzip" "http://127.0.0.1/build/assets/$css" 2>&1)
            echo "$headers"
            echo "$headers" | grep -qi "Content-Encoding: gzip"
            echo "$headers" | grep -qi "Cache-Control: public, max-age=31536000, immutable"
            echo "$headers" | grep -qi "X-Content-Type-Options: nosniff"
            echo "$headers" | grep -qi "Referrer-Policy: strict-origin-when-cross-origin"
            echo "$headers" | grep -qi "X-Frame-Options: SAMEORIGIN"
            echo "$headers" | grep -qi "Permissions-Policy: camera=(self)"
            echo "nginx headers OK"'
          docker rm -f nginx-check
