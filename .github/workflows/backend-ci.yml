name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/backend-ci.yml'

# Phase 22 (Security Audit, F-04): explicitly scope the default GITHUB_TOKEN
# down to read-only rather than relying on the repository/organization
# default — this workflow never needs to write anything.
permissions:
  contents: read

defaults:
  run:
    working-directory: apps/api

jobs:
  quality:
    name: Backend quality gates (PHP 8.4)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, curl, libxml, pdo, pdo_sqlite, sqlite3, bcmath, ctype, fileinfo, tokenizer, xml
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: apps/api/vendor
          key: composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: |
            composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate composer.json
        run: composer validate --strict

      - name: Composer audit (dependency vulnerability scan)
        run: composer audit --locked

      - name: Prepare ephemeral test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint (code style)
        run: vendor/bin/pint --test

      - name: PHPStan / Larastan (static analysis)
        run: vendor/bin/phpstan analyse

      - name: PHPUnit (automated tests)
        run: php artisan test
