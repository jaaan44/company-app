# Standard local backend development environment (Phase 4A — DEC-027,
# superseding DEC-013). Three services only: nginx, app (PHP-FPM), mysql.
# Flutter (apps/mobile) deliberately stays outside Docker — see
# docs/handoffs/V1_PHASE_04A_HANDOFF.md.
#
# Quick start: docker compose up -d --build
# Full first-time setup: README.md "Backend (Docker)".
#
# Host ports (application 8012, MySQL 3347 by default) are configurable
# via APP_PORT/MYSQL_PORT — export them, or set them in a root-level
# .env, if either default is already taken on your machine. Neither
# affects the containers' own internal ports.
#
# NEVER run this file on the staging VPS (incident 2026-10-17, DEC-070).
# Staging uses docker-compose.staging.yml with `-p company-app`. Two
# guards make this file refuse there:
#   - its own project name, `company-app-dev`, so it can never take over
#     staging's containers or its `company-app_mysql-data` volume (with
#     the same container names, `up` fails with "name already in use"
#     while staging runs, instead of replacing them);
#   - the app container's entrypoint refuses to start when the checkout
#     has a `.env.staging` (only the staging host has one) or
#     apps/api/.env says APP_ENV=staging/production.

name: company-app-dev

services:
  app:
    build:
      context: ./docker/php
    container_name: company-app-api
    working_dir: /var/www/html
    volumes:
      - ./apps/api:/var/www/html
      - vendor:/var/www/html/vendor
      # Read-only view of the repository root, only so the entrypoint can
      # see a staging host's .env.staging and refuse to start (DEC-070).
      - .:/repo-root:ro
    # Deliberately no `env_file`/`environment` here: Laravel reads
    # apps/api/.env directly (it's part of the bind mount above) via its
    # own Dotenv loading. Injecting the same values as container OS
    # environment variables would make them outrank phpunit.xml's
    # testing-environment overrides (PHPUnit's <env> doesn't force-replace
    # an already-set variable), silently pointing `php artisan test`
    # inside the container at the real dev database instead of the
    # isolated in-memory SQLite it uses everywhere else — see
    # docs/handoffs/V1_PHASE_04A_HANDOFF.md §Environment configuration.
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - company-app

  nginx:
    image: nginx:1.27-alpine
    container_name: company-app-nginx
    ports:
      # Host port is configurable (APP_PORT) to avoid clashing with
      # whatever else a developer's machine already has on a given port;
      # 8012 is the project's standard default. Override by exporting
      # APP_PORT or setting it in a root-level .env before `docker
      # compose up` — never edit this file to change it. The container's
      # own internal port (80, Nginx's normal listen port) is unaffected
      # either way.
      - "${APP_PORT:-8012}:80"
    volumes:
      - ./apps/api:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - company-app

  mysql:
    image: mysql:8.4
    container_name: company-app-mysql
    environment:
      # Local development credentials only — never used in production,
      # never committed as real secrets. Must match apps/api/.env's
      # DB_DATABASE/DB_USERNAME/DB_PASSWORD (see .env.docker.example).
      MYSQL_DATABASE: company_app
      MYSQL_USER: company_app
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      # Host port is configurable (MYSQL_PORT) since 3306 is commonly
      # already taken by another local MySQL install/service — 3347 is
      # the project's non-conflicting default. This mapping is for host
      # tools only (e.g. MySQL Workbench, a CLI client on the developer's
      # machine) — it has NO effect on Laravel's own connection, which
      # always uses DB_HOST=mysql / DB_PORT=3306 (the container's
      # internal port, container-to-container, unaffected by this host
      # mapping). Still bound to 127.0.0.1 only — not exposed beyond the
      # developer's own machine.
      - "127.0.0.1:${MYSQL_PORT:-3347}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - company-app

volumes:
  mysql-data:
  # Isolates the container's Composer-installed dependencies from
  # whatever (or nothing) exists in the host's apps/api/vendor, so the
  # bind mount above never shadows/mismatches them — see
  # docs/handoffs/V1_PHASE_04A_HANDOFF.md §Composer/vendor strategy.
  vendor:

networks:
  company-app:
    driver: bridge
